# Content plan, Oct 18 - Nov 16, 2026. Edit dates/status here, then: python -m lampstudio calendar
# (writes calendar.ics to import into Google/Apple Calendar, and CALENDAR.md)
# status: planned | drafted | recorded | rendered | finished | scheduled | published
# Times default to channel.yaml cadence (story Sun 8:00, faith talk Wed 18:00, shorts 18:00 MT).
#
# Three series, each with its own playlist:
#   STJ  = Stories Jesus Told       (parables; Luke 15 run continues, then the Good Samaritan)
#   WGSU = When God Showed Up       (moments God appeared or acted; launches Nov 1)
#   WOB  = Women of the Bible       (launches Nov 8)
# From Nov 1 the series take turns week by week (WGSU, WOB, STJ), so every series gets a
# new episode every three weeks and no two weeks in a row look the same. Each week's
# Wednesday faith talk goes deeper on that week's Sunday story. The Saturday Short before a
# series launch is a teaser for it.

series:
  STJ:  "Stories Jesus Told"
  WGSU: "When God Showed Up"
  WOB:  "Women of the Bible"

